# West-Manifest: CANbossTouch als Zephyr-Applikation (T2-Topologie,
# CANbossTouch ist das Manifest-Repository).
#
# Einrichtung:
#   mkdir touch-workspace && cd touch-workspace
#   west init -m https://github.com/protronic/CANbossTouch
#   west update
#   git -C CANbossTouch submodule update --init \
#       Middlewares/CANopen/CANopenNode Middlewares/Third_Party/berry
#
# Bauen (Simulation am PC, LVGL-Fenster via SDL2):
#   ZEPHYR_TOOLCHAIN_VARIANT=host west build -b native_sim/native/64 CANbossTouch/zephyr-app
#
# Der STM32-Build (Makefile) bleibt davon unberuehrt.

manifest:
  self:
    path: CANbossTouch

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.1.0
      path: zephyr
      west-commands: scripts/west-commands.yml
    - name: lvgl
      remote: zephyrproject-rtos
      revision: 1ed1ddd881c3784049a92bb9fe37c38c6c74d998   # LVGL 9.3 (Stand Zephyr v4.1.0)
      path: modules/lib/gui/lvgl
    # fuer das Hardware-Target stm32h573i_dk (Revisionen = Zephyr v4.1.0)
    - name: cmsis
      remote: zephyrproject-rtos
      revision: d1b8b20b6278615b00e136374540eb1c00dcabe7
      path: modules/hal/cmsis
    - name: cmsis_6
      remote: zephyrproject-rtos
      repo-path: CMSIS_6
      revision: 783317a3072554acbac86cca2ff24928cbf98d30
      path: modules/lib/cmsis_6
    - name: hal_stm32
      remote: zephyrproject-rtos
      revision: 55043bcc35fffa3b4a8c75a696d932b5020aad09
      path: modules/hal/stm32
