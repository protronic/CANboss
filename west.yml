# West-Manifest: CANboss-Monorepo als Zephyr-Workspace (T2-Topologie,
# dieses Repo ist das Manifest-Repository).
#
# Einrichtung:
#   mkdir canboss-workspace && cd canboss-workspace
#   west init -m https://github.com/protronic/CANboss
#   west update
#   git -C CANboss submodule update --init
#
# Bereits geklont? Workspace um den Klon herum anlegen:
#   cd <verzeichnis-ueber-dem-klon>
#   west init -l CANboss && west update
#
# Apps (alle: west build -b native_sim/native/64 CANboss/apps/<name>):
#   apps/monitor        Terminal-Monitor (TUI; auch POSIX-Build via make)
#   apps/touch          LVGL-Touchpanel (native_sim + stm32h573i_dk)
#   apps/nodes/demo_*   Demo-Knoten (IO/Antrieb/Klimasensor) fuer vcan-Tests

manifest:
  self:
    path: CANboss

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: protronic
      url-base: https://github.com/protronic

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      path: zephyr
      west-commands: scripts/west-commands.yml
    # Fork: CMDB-Chunking / Execute-Timeout / RAM_DL-Soft-Limit (DRAW_EVE)
    - name: lvgl
      remote: protronic
      revision: 178444268edbc51c642ca3838385f30e7b370373
      path: modules/lib/gui/lvgl
    # fuer Hardware-Targets (stm32h573i_dk); Revisionen = Zephyr v4.4.2
    - name: cmsis
      remote: zephyrproject-rtos
      revision: 512cc7e895e8491696b61f7ba8066b4a182569b8
      path: modules/hal/cmsis
    - name: cmsis_6
      remote: zephyrproject-rtos
      repo-path: CMSIS_6
      revision: 30a859f44ef8ab4dc8f84b03ed586fd16ccf9d74
      path: modules/hal/cmsis_6
    - name: hal_stm32
      remote: zephyrproject-rtos
      revision: fc11896dd39cfca37bf9b4aeaaa2df8861b81875
      path: modules/hal/stm32
