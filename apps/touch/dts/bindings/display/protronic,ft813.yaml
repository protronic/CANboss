# FTDI/Bridgetek FT813 (EVE2) am SPI — DT-Knoten fuer Timings/GPIO.
# Auf stm32h573i_dk steuert drivers/lv_draw_eve_zephyr.c den Chip
# (LVGL DRAW_EVE). Legacy: drivers/ft813.c als dummer RGB565-Framebuffer.

description: FT813 (EVE2) SPI display (DRAW_EVE glue or legacy framebuffer)

compatible: "protronic,ft813"

include: [spi-device.yaml]

properties:
  pd-gpios:
    type: phandle-array
    required: true
    description: |
      Power-Down-/Reset-Leitung (PD_N, low-aktiv). Asserted = Chip im
      Power-Down.

  width:
    type: int
    default: 800
    description: Panelbreite in Pixeln

  height:
    type: int
    default: 480
    description: Panelhoehe in Pixeln

  backlight-duty:
    type: int
    default: 96
    description: Backlight-PWM-Tastgrad nach dem Einschalten (0..128)

  touch-poll-ms:
    type: int
    default: 30
    description: |
      Nur Legacy-Framebuffer-Treiber: Abtastintervall der Touch-Engine
      in Millisekunden (0 = aus). DRAW_EVE nutzt lv_draw_eve_touch.
