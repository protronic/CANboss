# Zephyr-Konfiguration der CANbossTouch-App

CONFIG_CAN=y

# LVGL (Modul aus dem west-Manifest); Display kommt aus dem Devicetree
# (chosen zephyr,display)
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_USE_LIST=y
CONFIG_LV_USE_SPINBOX=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_FLEX=y

# Eingabe (Touch/Maus -> LVGL-Pointer)
CONFIG_INPUT=y

# Shell mit "berry"-Kommando (Skript-Zugriff auf OD/PDOs)
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=16384
CONFIG_SHELL_CMD_BUFF_SIZE=512

# Main-Thread: LVGL-Loop; CAN-RX/Mainline/SDO-Worker sind k_threads
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Berry-VM: malloc aus der libc (native_sim: Host-libc)
CONFIG_BOOT_BANNER=n

# Gleitkomma-Formatierung (Berry real, F32-Datenpunkte)
CONFIG_CBPRINTF_FP_SUPPORT=y
