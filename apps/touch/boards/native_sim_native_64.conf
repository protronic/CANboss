# native_sim: LVGL-Fenster ueber den SDL-Displaytreiber (libsdl2-dev
# auf dem Host noetig), Maus als LVGL-Pointer.
# Headless (CI/Container ohne SDL2): mit
#   -DEXTRA_CONF_FILE=overlays/headless.conf
#   -DEXTRA_DTC_OVERLAY_FILE=overlays/headless.overlay
# auf das Dummy-Display umschalten.
CONFIG_SDL_DISPLAY=y
CONFIG_INPUT_SDL_TOUCH=y
# Shell (berry-Kommando) ueber die UART-Konsole auf stdin/stdout
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_POSIX=y
CONFIG_NATIVE_UART_0_ON_STDINOUT=y
