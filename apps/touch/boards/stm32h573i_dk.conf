# STM32H573I-DK: FT813 (EVE2) am SPI2, CAN ueber FDCAN2
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_DUMMY_DISPLAY=y

# LVGL EVE-GPU-Pfad (Displaylisten); Zephyr-Chosen ist nur Dummy (min. VDB)
CONFIG_LV_USE_DRAW_EVE=y
CONFIG_LV_DRAW_EVE_EVE_GENERATION=2
CONFIG_LV_DRAW_EVE_WRITE_BUFFER_SIZE=2048
CONFIG_CANBOSSTOUCH_DRAW_EVE=y
CONFIG_LV_Z_VDB_SIZE=1
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_DOUBLE_VDB=n

# 640 KiB SRAM: Heaps knapper als am PC
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Berry braucht eine vollwertige libc (setjmp, malloc, strtod)
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=57344

# Konsole/Shell auf der ST-Link-VCP-UART (Board-Default)
CONFIG_UART_CONSOLE=y

# Feintuning fuer 640 KiB SRAM (Zephyr 4.4 / SDK 1.0)
CONFIG_LV_Z_MEM_POOL_SIZE=40960
CONFIG_SHELL_STACK_SIZE=9216
CONFIG_MAIN_STACK_SIZE=12288
