# STM32H573I-DK: FT813-Display am SPI2, Touch-Input, CAN ueber FDCAN2
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_INPUT=y

# LVGL-Renderpuffer: 1 x 10% von 800x480 in RGB565 (~77 KiB) im SRAM
CONFIG_LV_Z_VDB_SIZE=8
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_DOUBLE_VDB=n

# 640 KiB SRAM: Heaps knapper als am PC
CONFIG_HEAP_MEM_POOL_SIZE=32768

# Berry braucht eine vollwertige libc (setjmp, malloc, strtod)
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=57344

# Konsole/Shell auf der ST-Link-VCP-UART (Board-Default)
CONFIG_UART_CONSOLE=y

# Feintuning fuer 640 KiB SRAM
CONFIG_LV_Z_MEM_POOL_SIZE=40960
CONFIG_SHELL_STACK_SIZE=10240
CONFIG_MAIN_STACK_SIZE=12288
