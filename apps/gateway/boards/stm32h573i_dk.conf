# NDJSON laeuft ueber USB-CDC-ACM am USB-Stecker des Boards
# (boards/stm32h573i_dk.overlay: chosen canboss,jsonapi-uart).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

# Seriennummer aus der STM32-UID: der Browser kann so mehrere Gateways
# am selben Rechner auseinanderhalten.
CONFIG_HWINFO=y

# CDC-ACM bekommt eine eigene Workqueue statt der System-Workqueue:
# der NDJSON-Transport darf nicht stehenbleiben, wenn irgendein anderes
# Work-Item (CAN, Sensorik, ...) die System-Queue blockiert.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Der NDJSON-Strom haengt jetzt am USB - die ST-Link-VCP ist die
# Zephyr-Konsole (Board-chosen zephyr,console = usart1): Boot-Banner,
# Statusmeldungen des Gateways (src/main.c, src/usb_cdc.c) und der
# USB-Enumerations-Fortschritt landen dort mit 115200 Baud.
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BOOT_BANNER=y

# Zephyr-Shell auf der Konsole (chosen zephyr,shell-uart = usart1):
# interaktives Monitoring beim Bring-up - "usbd device status",
# "can show fdcan@...", "device list", "kernel threads/uptime".
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_USBD_SHELL=y
# fuer "kernel threads"/"kernel stacks"
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

# USBD-Stack auf INF: meldet Enumeration/Konfiguration auf der Konsole.
# CDC-ACM bleibt aus - usbd_cdc_acm.c macht auf INF-Level einen
# LOG_HEXDUMP jedes empfangenen Pakets; mit LOG_MODE_MINIMAL landet der
# synchron auf der 115200-Baud-VCP und wuerde jeden fw-Upload
# ausbremsen.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y

# 640 KiB SRAM: Default 1 Slot x 64 KiB (Kconfig CANBOSS_GW_FW_*)
