# NDJSON laeuft ueber USB-CDC-ACM am USB-Stecker des Boards
# (boards/stm32h573i_dk.overlay: chosen canboss,jsonapi-uart).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y

# Seriennummer aus der STM32-UID: der Browser kann so mehrere Gateways
# am selben Rechner auseinanderhalten.
CONFIG_HWINFO=y

# CDC-ACM schiebt seine Transfers ueber die System-Workqueue; der
# Default-Stack ist neben CANopen zu knapp.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Der NDJSON-Strom haengt jetzt am USB - die ST-Link-VCP bleibt frei
# fuer Konsole und Logs (das war mit der VCP-Variante nicht moeglich).
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# ... aber der USB-Stack muss dabei still sein: usbd_cdc_acm.c macht auf
# INF-Level einen LOG_HEXDUMP jedes empfangenen Pakets. Mit
# LOG_MODE_MINIMAL landet der synchron auf der 115200-Baud-VCP und
# wuerde jeden fw-Upload ausbremsen.
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y

# 640 KiB SRAM: Default 1 Slot x 64 KiB (Kconfig CANBOSS_GW_FW_*)
