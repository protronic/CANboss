# NDJSON auf stdin/stdout des Host-Prozesses:
#   ./build/zephyr/zephyr.exe            (interaktiv/socat)
#   echo '{"ping":1}' | ./build/zephyr/zephyr.exe
CONFIG_SERIAL=y
CONFIG_UART_NATIVE_PTY=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# stdout gehoert dem NDJSON-Strom: Konsole/Logs aus
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
