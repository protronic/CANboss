# CANboss-Gateway: CANopen + NDJSON ueber UART

CONFIG_CAN=y
CONFIG_SERIAL=y
CONFIG_RING_BUFFER=y

# Berry-Compiler ({"repl": ...}) parst rekursiv im Main-Thread
CONFIG_MAIN_STACK_SIZE=16384

# Der NDJSON-Strom teilt sich die UART nicht mit Konsole/Logs:
# Boards leiten die Konsole um oder schalten sie ab (boards/*.conf).
CONFIG_BOOT_BANNER=n
